# control-api served from the root of https://cosai.nrru.ac.th
#
# Replaces the old "https://cosai.nrru.ac.th:8000/..." client URLs: uvicorn
# listens on loopback only and Apache terminates TLS on 443, so every endpoint
# keeps its path and loses the port (e.g. /schedule/get_rooms_dashboard/).
#
# Enable once, then reload:
#   a2enmod ssl proxy proxy_http headers rewrite
#   a2ensite cosai.nrru.ac.th && systemctl reload apache2
#
# Run the API behind it with forwarded headers, otherwise FastAPI builds its
# redirects and openapi.json with http:// and the browser blocks them:
#   uvicorn main:app --host 127.0.0.1 --port 8000 \
#     --proxy-headers --forwarded-allow-ips 127.0.0.1

<VirtualHost *:80>
    ServerName cosai.nrru.ac.th

    RewriteEngine On
    RewriteRule ^/?(.*)$ https://cosai.nrru.ac.th/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName cosai.nrru.ac.th

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/apache.crt
    SSLCertificateKeyFile /etc/apache2/ssl/apache.key

    ErrorLog  ${APACHE_LOG_DIR}/cosai-error.log
    CustomLog ${APACHE_LOG_DIR}/cosai-access.log combined

    # ---- control-api (FastAPI on 127.0.0.1:8000) -------------------------
    # Keep the browser's Host and scheme so FastAPI's own redirects and the
    # Swagger "Try it out" base URL point back at https://cosai.nrru.ac.th.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # Server-Sent Events, listed first so it wins over the generic rule below.
    # flushpackets=on stops mod_proxy holding each event until the response
    # ends, and the long timeout keeps an idle stream open.
    <Location /mqtt-stream>
        SetEnv no-gzip 1
    </Location>
    ProxyPass /mqtt-stream http://127.0.0.1:8000/mqtt-stream flushpackets=on timeout=3600 connectiontimeout=10

    # Every top-level prefix registered in routes/api.py, plus the docs and the
    # /static assets main.py mounts for them. Anchored per path segment so a
    # new SPA route cannot be swallowed by a partial prefix match.
    ProxyPassMatch "^/((?:accessory|application|dashboard|migration|room|room-binding|room-cancel|room-usage|schedule|schedule_AP|schedule_replace|send-mqtt|send_2_device|staff_access|test|user|user_access|docs|redoc|static)(?:/.*)?)$" "http://127.0.0.1:8000/$1"
    ProxyPassMatch "^/(openapi\.json)$" "http://127.0.0.1:8000/$1"

    # One reverse mapping covers every rule above: the backend only ever emits
    # Location headers rooted at its own origin.
    ProxyPassReverse / http://127.0.0.1:8000/

    # ---- Vue SPA ---------------------------------------------------------
    # mod_proxy claims the paths above during translate_name before mod_rewrite
    # runs, so the fallback below only ever sees frontend requests.
    DocumentRoot /var/www/room-app-main/dist

    <Directory /var/www/room-app-main/dist>
        Require all granted
        AllowOverride None
        Options -Indexes
    </Directory>

    # Unmatched paths fall back to index.html so vue-router history URLs
    # (/admin/rooms, /desktop/schedule, /qr-front, ...) survive a reload.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ /index.html [L]
</VirtualHost>
